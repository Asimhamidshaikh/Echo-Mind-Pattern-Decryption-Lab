<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Mind: Cognitive Decryption Lab</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2e;
      --accent-blue: #00d2ff;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --text-main: #e2e8f0;
      --text-muted: #8492a6;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-blue);
      color: #000;
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
    }

    .game-container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      display: none;
    }

    .game-container.active {
      display: block;
    }

    /* MODULE 1: SEQUENCE MATRIX */
    .status-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.2);
      padding: 12px 20px;
      border-radius: 6px;
    }

    .stat-box span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-box strong {
      font-size: 1.4rem;
      color: var(--accent-blue);
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 360px;
      margin: 0 auto 25px auto;
    }

    .matrix-node {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .matrix-node.active-flash {
      background: var(--accent-blue) !important;
      box-shadow: 0 0 25px var(--accent-blue);
      border-color: #fff;
    }

    .matrix-node.user-success {
      background: var(--accent-green) !important;
      box-shadow: 0 0 15px var(--accent-green);
    }

    .matrix-node.user-fail {
      background: var(--accent-red) !important;
      box-shadow: 0 0 15px var(--accent-red);
    }

    /* MODULE 2: CIPHER DECRYPTION */
    .cipher-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      letter-spacing: 1px;
      line-height: 1.8;
      margin-bottom: 20px;
      word-wrap: break-word;
      border-left: 4px solid var(--accent-blue);
    }

    .cipher-controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .mapping-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .map-pair {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.03);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .map-pair span {
      font-family: monospace;
      font-weight: bold;
      color: var(--accent-blue);
    }

    .map-pair input {
      width: 32px;
      height: 32px;
      text-align: center;
      background: #000;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .map-pair input:focus {
      border-color: var(--accent-blue);
      outline: none;
    }

    .btn {
      background: var(--accent-blue);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
    }

    .controls-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .feedback-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .feedback-msg.show {
      display: block;
    }

    .feedback-msg.success {
      background: rgba(0, 255, 136, 0.2);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .feedback-msg.error {
      background: rgba(255, 51, 102, 0.2);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }
  </style>
</head>
<body>

  <header>
    <h1>Echo Mind Lab</h1>
    <p>Train Short-Term Memory, Visual Recall, and Cryptographic Deduction</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('sequence')">Module 1: Sequence Matrix</button>
    <button class="tab-btn" onclick="switchTab('cipher')">Module 2: Cipher Decryption</button>
  </div>

  <!-- MODULE 1: SEQUENCE MATRIX -->
  <div id="module-sequence" class="game-container active">
    <div class="status-panel">
      <div class="stat-box">
        <span>Current Level</span>
        <strong id="seq-level">1</strong>
      </div>
      <div class="stat-box">
        <span>High Score</span>
        <strong id="seq-highscore">0</strong>
      </div>
      <button class="btn" id="start-seq-btn" onclick="startSequenceGame()">Start Round</button>
    </div>

    <div class="matrix-grid" id="matrix-grid">
      <div class="matrix-node" data-index="0"></div>
      <div class="matrix-node" data-index="1"></div>
      <div class="matrix-node" data-index="2"></div>
      <div class="matrix-node" data-index="3"></div>
      <div class="matrix-node" data-index="4"></div>
      <div class="matrix-node" data-index="5"></div>
      <div class="matrix-node" data-index="6"></div>
      <div class="matrix-node" data-index="7"></div>
      <div class="matrix-node" data-index="8"></div>
    </div>

    <div id="seq-feedback" class="feedback-msg"></div>
  </div>

  <!-- MODULE 2: CIPHER DECRYPTION -->
  <div id="module-cipher" class="game-container">
    <div class="status-panel">
      <div class="stat-box">
        <span>Puzzle ID</span>
        <strong id="cipher-id">#01</strong>
      </div>
      <div class="stat-box">
        <span>Hints Used</span>
        <strong id="cipher-hints">0</strong>
      </div>
      <button class="btn btn-secondary" onclick="loadNewCipher()">New Encrypted Text</button>
    </div>

    <p style="margin-bottom: 10px; font-size: 0.9rem; color: var(--text-muted);">
      Encrypted Passage (Monoalphabetic Substitution):
    </p>
    <div class="cipher-box" id="encrypted-display">---</div>

    <p style="margin-bottom: 10px; font-size: 0.9rem; color: var(--text-muted);">
      Live Decrypted Output:
    </p>
    <div class="cipher-box" id="decrypted-display" style="border-left-color: var(--accent-green);">---</div>

    <div class="cipher-controls">
      <p style="font-size: 0.9rem; color: var(--text-muted);">Substitution Key Map (Cipher &rarr; Plain):</p>
      <div class="mapping-inputs" id="mapping-inputs"></div>

      <div class="controls-row">
        <button class="btn btn-secondary" onclick="revealHint()">Reveal Hint</button>
        <button class="btn" onclick="verifyDecryption()">Submit Decryption</button>
      </div>
    </div>

    <div id="cipher-feedback" class="feedback-msg"></div>
  </div>

  <script>
    /* Global Navigation Handler */
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));

      if (tabName === 'sequence') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('module-sequence').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('module-cipher').classList.add('active');
      }
    }

    /* ===================================================
       MODULE 1: SEQUENCE MATRIX LOGIC
       =================================================== */
    let sequence = [];
    let userStep = 0;
    let seqLevel = 1;
    let seqHighScore = 0;
    let isPlayingSequence = false;
    let isAcceptingInput = false;

    const nodes = document.querySelectorAll('.matrix-node');
    const levelDisplay = document.getElementById('seq-level');
    const highScoreDisplay = document.getElementById('seq-highscore');
    const seqFeedback = document.getElementById('seq-feedback');
    const startSeqBtn = document.getElementById('start-seq-btn');

    nodes.forEach(node => {
      node.addEventListener('click', (e) => {
        if (!isAcceptingInput) return;
        const index = parseInt(e.target.getAttribute('data-index'));
        handleNodeClick(index, e.target);
      });
    });

    function startSequenceGame() {
      sequence = [];
      userStep = 0;
      seqLevel = 1;
      isPlayingSequence = true;
      startSeqBtn.disabled = true;
      levelDisplay.innerText = seqLevel;
      showSeqFeedback("", "");
      nextSequenceRound();
    }

    function nextSequenceRound() {
      userStep = 0;
      isAcceptingInput = false;
      levelDisplay.innerText = seqLevel;
      
      // Add random node index (0 to 8)
      sequence.push(Math.floor(Math.random() * 9));
      
      playSequence();
    }

    function playSequence() {
      let i = 0;
      const interval = setInterval(() => {
        if (i > 0) {
          nodes[sequence[i - 1]].classList.remove('active-flash');
        }
        
        if (i < sequence.length) {
          nodes[sequence[i]].classList.add('active-flash');
          i++;
        } else {
          clearInterval(interval);
          isAcceptingInput = true;
        }
      }, 600);
    }

    function handleNodeClick(index, element) {
      if (index === sequence[userStep]) {
        element.classList.add('user-success');
        setTimeout(() => element.classList.remove('user-success'), 200);
        userStep++;

        if (userStep === sequence.length) {
          isAcceptingInput = false;
          seqLevel++;
          if (seqLevel - 1 > seqHighScore) {
            seqHighScore = seqLevel - 1;
            highScoreDisplay.innerText = seqHighScore;
          }
          showSeqFeedback("Sequence correct! Advancing...", "success");
          setTimeout(() => {
            showSeqFeedback("", "");
            nextSequenceRound();
          }, 1000);
        }
      } else {
        element.classList.add('user-fail');
        setTimeout(() => element.classList.remove('user-fail'), 300);
        showSeqFeedback(`Sequence Broken! Game Over. Reached Level ${seqLevel}`, "error");
        isPlayingSequence = false;
        isAcceptingInput = false;
        startSeqBtn.disabled = false;
      }
    }

    function showSeqFeedback(msg, type) {
      if (!msg) {
        seqFeedback.className = "feedback-msg";
        seqFeedback.innerText = "";
        return;
      }
      seqFeedback.className = `feedback-msg show ${type}`;
      seqFeedback.innerText = msg;
    }

    /* ===================================================
       MODULE 2: CIPHER DECRYPTION LOGIC
       =================================================== */
    const cipherTexts = [
      "NEUROPLASTICITY IS THE ABILITY OF THE BRAIN TO REORGANIZE ITSELF BY FORMING NEW NEURAL CONNECTIONS THROUGHOUT LIFE.",
      "COGNITIVE FLEXIBILITY ALLOWS AN INDIVIDUAL TO SWITCH BETWEEN THINKING ABOUT TWO DIFFERENT CONCEPTS SIMULTANEOUSLY.",
      "WORKING MEMORY IS A COGNITIVE SYSTEM WITH A LIMITED CAPACITY THAT CAN HOLD INFORMATION TEMPORARILY."
    ];

    let currentPassageIndex = 0;
    let targetText = "";
    let currentCipherMap = {}; // Maps Cipher Letter -> Plain Letter
    let userKeyMap = {}; // User's custom guesses: Cipher -> Plain
    let hintsUsed = 0;

    const encryptedDisplay = document.getElementById('encrypted-display');
    const decryptedDisplay = document.getElementById('decrypted-display');
    const mappingInputs = document.getElementById('mapping-inputs');
    const cipherFeedback = document.getElementById('cipher-feedback');
    const hintsDisplay = document.getElementById('cipher-hints');
    const cipherIdDisplay = document.getElementById('cipher-id');

    function loadNewCipher() {
      hintsUsed = 0;
      hintsDisplay.innerText = hintsUsed;
      showCipherFeedback("", "");
      
      targetText = cipherTexts[currentPassageIndex];
      cipherIdDisplay.innerText = `#0${currentPassageIndex + 1}`;
      currentPassageIndex = (currentPassageIndex + 1) % cipherTexts.length;

      generateCipherMap();
      renderMappingControls();
      updateDecryptedView();
    }

    function generateCipherMap() {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      let shuffled = [...alphabet].sort(() => Math.random() - 0.5);
      
      currentCipherMap = {};
      userKeyMap = {};

      alphabet.forEach((char, index) => {
        currentCipherMap[char] = shuffled[index];
        userKeyMap[shuffled[index]] = ""; // Initialize user mapping
      });

      // Encrypt the target text using cipher map
      let encrypted = "";
      for (let char of targetText) {
        if (/[A-Z]/.test(char)) {
          encrypted += currentCipherMap[char];
        } else {
          encrypted += char;
        }
      }
      encryptedDisplay.innerText = encrypted;
    }

    function renderMappingControls() {
      mappingInputs.innerHTML = "";
      // Find all unique letters in the current encrypted text
      const encryptedText = encryptedDisplay.innerText;
      const uniqueCipherChars = [...new Set(encryptedText.replace(/[^A-Z]/g, ""))].sort();

      uniqueCipherChars.forEach(cipherChar => {
        const pairDiv = document.createElement('div');
        pairDiv.className = 'map-pair';
        
        const label = document.createElement('span');
        label.innerText = `${cipherChar}:`;

        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.dataset.cipher = cipherChar;
        input.value = userKeyMap[cipherChar] || "";

        input.addEventListener('input', (e) => {
          const val = e.target.value.toUpperCase();
          e.target.value = val;
          userKeyMap[cipherChar] = val;
          updateDecryptedView();
        });

        pairDiv.appendChild(label);
        pairDiv.appendChild(input);
        mappingInputs.appendChild(pairDiv);
      });
    }

    function updateDecryptedView() {
      const encryptedText = encryptedDisplay.innerText;
      let output = "";

      for (let char of encryptedText) {
        if (/[A-Z]/.test(char)) {
          const mapped = userKeyMap[char];
          output += mapped ? mapped : "_";
        } else {
          output += char;
        }
      }
      decryptedDisplay.innerText = output;
    }

    function revealHint() {
      const encryptedText = encryptedDisplay.innerText;
      const uniqueCipherChars = [...new Set(encryptedText.replace(/[^A-Z]/g, ""))];
      
      // Find cipher letters not yet correctly mapped by user
      const unmapped = uniqueCipherChars.filter(cipherChar => {
        // Find corresponding true plain char
        const truePlain = Object.keys(currentCipherMap).find(key => currentCipherMap[key] === cipherChar);
        return userKeyMap[cipherChar] !== truePlain;
      });

      if (unmapped.length === 0) {
        showCipherFeedback("All characters are already correctly mapped!", "success");
        return;
      }

      // Pick a random unmapped cipher character
      const pickCipher = unmapped[Math.floor(Math.random() * unmapped.length)];
      const truePlainChar = Object.keys(currentCipherMap).find(key => currentCipherMap[key] === pickCipher);

      userKeyMap[pickCipher] = truePlainChar;
      hintsUsed++;
      hintsDisplay.innerText = hintsUsed;

      // Update UI input field
      const inputEl = document.querySelector(`input[data-cipher="${pickCipher}"]`);
      if (inputEl) inputEl.value = truePlainChar;

      updateDecryptedView();
      showCipherFeedback(`Hint Applied: Encrypted '${pickCipher}' translates to '${truePlainChar}'`, "success");
    }

    function verifyDecryption() {
      if (decryptedDisplay.innerText === targetText) {
        showCipherFeedback("Decryption Successful! You have unlocked the cognitive passage.", "success");
      } else {
        showCipherFeedback("Decryption Incomplete or Incorrect. Keep analyzing pattern frequencies!", "error");
      }
    }

    function showCipherFeedback(msg, type) {
      if (!msg) {
        cipherFeedback.className = "feedback-msg";
        cipherFeedback.innerText = "";
        return;
      }
      cipherFeedback.className = `feedback-msg show ${type}`;
      cipherFeedback.innerText = msg;
    }

    // Initial Load
    loadNewCipher();
  </script>
</body>
  </html>
